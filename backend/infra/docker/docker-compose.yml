services:
  postgres:
    image: postgres:17
    container_name: feedgpt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: feedgpt
      POSTGRES_PASSWORD: feedgpt
      POSTGRES_DB: feedgpt

    ports:
      - 5435:5432

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  minio:
    image: quay.io/minio/minio
    container_name: feedgpt-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: feedgpt
      MINIO_ROOT_PASSWORD: feedgptminio

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data
  
  redis:
    image: redis
    container_name: feedgpt-redis
    restart: unless-stopped
    
    ports:
      - "6001:6379"
    
    volumes:
      - redis_data:/data
  
  redis2:
    image: redis
    container_name: feedgpt-data-ingestor-redis
    restart: unless-stopped
    
    ports:
      - "6002:6379"
    
    volumes:
      - redis2_data:/data
  
  redis3:
    image: redis
    container_name: feedgpt-embedder-redis
    restart: unless-stopped

    ports:
      - "6003:6379"
    
    volumes:
      - redis3_data:/data
  
  redis4:
    image: redis
    container_name: feedgpt-qdrant-redis
    restart: unless-stopped

    ports:
      - "6004:6379"
    
    volumes:
      - redis4_data:/data
  
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage



volumes:
  postgres_data:
  minio_data:
  redis_data:
  redis2_data:
  redis3_data:
  redis4_data:
  qdrant_data:
